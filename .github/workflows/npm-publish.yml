# Publishes to the public npm registry when a version tag is pushed.
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# The tag is the source of truth: its `v`-stripped value is written into
# package.json before publishing, so the published version can never drift from
# the tag. A non-semver tag is rejected rather than published under a wrong
# version — npm refusing to republish an existing version is the final backstop.
#
# The repo is pnpm-managed: `pnpm-lock.yaml` is authoritative. Node is pinned to
# >= 22.13 because pnpm 11 requires it.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

# Two tags pushed in quick succession must not race each other onto the registry.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile

      - name: Resolve version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const version = tag.startsWith("v") ? tag.slice(1) : tag;
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error("Refusing to publish: tag " + tag + " is not a semver tag (expected v1.2.3)");
              process.exit(1);
            }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.version !== version) {
              console.log("package.json " + pkg.version + " -> " + version + " (from tag)");
            }
            pkg.version = version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      # `dist/` is gitignored, so it must be built. The `prepack` hook also
      # rebuilds it, but an explicit step makes a failure obvious in the log.
      - run: pnpm build

      # npm answers an unauthenticated PUT with 404, not 401, so a missing or
      # unusable token is indistinguishable from "name is taken". Fail loudly
      # and specifically before that. Never echoes the token value.
      - name: Preflight auth check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::No NPM_TOKEN secret in this repo (or it is empty). Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "NPM_TOKEN present (${#NODE_AUTH_TOKEN} chars)"
          echo "--- npm whoami ---"
          npm whoami
          echo "--- scope ownership (@reactive) ---"
          npm access list packages @reactive || echo "::warning::could not read the @reactive scope with this token"

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
